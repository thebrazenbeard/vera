name: Branch and session anchor contract

on:
  push:
    branches:
      - feature/branch-session-anchor-contract-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-anchor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate bounded anchor protocol
        run: python -m unittest discover -s tests -p 'test_branch_session_anchor.py' -v
