name: Coherent currentness V3

on:
  pull_request:
    paths:
      - "runtime_cohesion/coherent_currentness_cut.py"
      - "tests/test_coherent_currentness_cut.py"
      - "architecture/VERA_COHERENT_CURRENTNESS_CUT_V3.json"
      - "docs/VERA_COHERENT_CURRENTNESS_CUT_V3.md"
      - ".github/workflows/coherent-currentness-v3.yml"

permissions:
  contents: read

jobs:
  focused-currentness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m py_compile runtime_cohesion/coherent_currentness_cut.py tests/test_coherent_currentness_cut.py
      - run: python -m unittest tests.test_coherent_currentness_cut -v
