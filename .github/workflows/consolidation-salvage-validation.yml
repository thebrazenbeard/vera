name: Consolidation salvage validation

on:
  pull_request:
    paths:
      - "experiments/tul_instrumented_host_fixture_v0_1/**"
      - "src/tul_fixture/**"
      - "template/default-vera-v1/**"
      - "r8a0/**"
      - "tests/r8a0/**"
      - "docs/r8a0/**"
      - "architecture/integration/VERA_BRANCH_DISPOSITION_20260903.json"
      - "docs/REPOSITORY_CONSOLIDATION_20260903.md"
      - ".github/workflows/consolidation-salvage-validation.yml"
      - ".github/workflows/r8a0-bounded-vertical-slice.yml"

permissions:
  contents: read

jobs:
  validate-salvaged-lineages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TUL test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile TUL source
        run: python -m py_compile src/tul_fixture/*.py
      - name: Run TUL fixture tests
        env:
          PYTHONPATH: src
        run: python -m pytest experiments/tul_instrumented_host_fixture_v0_1/tests -q
      - name: Compile salvaged R8A0 source and tests
        run: python -m compileall -q -f r8a0 tests/r8a0
      - name: Run salvaged R8A0 deterministic suite
        run: PYTHONHASHSEED=0 TERM=xterm python -X dev -m unittest discover -s tests/r8a0 -p 'test_*.py' -v
      - name: Verify default Vera template inventory
        run: |
          test -f template/default-vera-v1/README.md
          test -f template/default-vera-v1/BEHAVIOR_TARGET.md
          test -f template/default-vera-v1/CONTINUITY.md
          test -f template/default-vera-v1/EVALUATION_RUBRIC.md
          test -f template/default-vera-v1/PROGRAM_STATE_V1.md
          test -f template/default-vera-v1/TRAINING_RUNBOOK_V1.md
      - name: Validate branch-disposition inventory
        run: |
          python -m json.tool architecture/integration/VERA_BRANCH_DISPOSITION_20260903.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('architecture/integration/VERA_BRANCH_DISPOSITION_20260903.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = data['dispositions']
          names = [row['branch'] for row in rows]
          assert len(names) == len(set(names)), 'duplicate branch disposition'
          assert 'main' in names
          assert 'feature/pccc-host-bridge-v1' in names
          assert 'feature/tul-instrumented-host-fixture-v0.1' in names
          assert 'vera-stickers' in names
          PY
