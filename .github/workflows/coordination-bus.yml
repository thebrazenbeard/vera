name: Coordination bus

on:
  pull_request:
    paths:
      - "coordination_bus/**"
      - "tests/test_coordination_bus*.py"
      - "docs/COORDINATION_BUS*.md"
      - ".github/workflows/coordination-bus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run coordination bus tests
        run: python -m unittest discover -s tests -p "test_coordination_bus*.py" -v
      - name: Compile reference implementation
        run: python -m py_compile coordination_bus/*.py tests/test_coordination_bus*.py
