name: External evidence provider integration

on:
  pull_request:
    paths:
      - "architecture/integration/VERA_EXTERNAL_EVIDENCE_PROVIDER_REGISTRY_V1.json"
      - "architecture/integration/VERA_DEEP_MEMORY_ARCHIVE_INTEGRATION_V1.json"
      - "architecture/integration/vendor/**"
      - "runtime_cohesion/deep_memory_evidence.py"
      - "schemas/vera_external_evidence_provider_registry_v1.schema.json"
      - "scripts/validate_external_evidence_provider_registry.py"
      - "tests/test_deep_memory_evidence_adapter.py"
      - ".github/workflows/external-evidence-provider-integration.yml"
  push:
    paths:
      - "architecture/integration/VERA_EXTERNAL_EVIDENCE_PROVIDER_REGISTRY_V1.json"
      - "architecture/integration/VERA_DEEP_MEMORY_ARCHIVE_INTEGRATION_V1.json"
      - "architecture/integration/vendor/**"
      - "runtime_cohesion/deep_memory_evidence.py"
      - "schemas/vera_external_evidence_provider_registry_v1.schema.json"
      - "scripts/validate_external_evidence_provider_registry.py"
      - "tests/test_deep_memory_evidence_adapter.py"
      - ".github/workflows/external-evidence-provider-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate_external_evidence_provider_registry.py
      - run: python -m unittest tests.test_deep_memory_evidence_adapter -v
