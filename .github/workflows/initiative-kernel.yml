name: Initiative kernel

on:
  pull_request:
    paths:
      - "protocol/initiative_kernel.py"
      - "tests/test_initiative_kernel.py"
      - "docs/INITIATIVE_KERNEL_V0_1.md"
      - ".github/workflows/initiative-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run initiative kernel tests
        run: python -m unittest discover -s tests -p "test_initiative_kernel.py" -v
      - name: Compile reference implementation
        run: python -m py_compile protocol/initiative_kernel.py tests/test_initiative_kernel.py
