name: Integration Assurance

on:
  pull_request:
    paths:
      - "architecture/integration/**"
      - "architecture/identity/WORKFLOW_CONTINUITY_CURRENT.json"
      - "architecture/identity/VERA_GOVERNED_WORKFLOW_CONTINUITY_V2.json"
      - "schemas/vera_governed_workflow_continuity_v2.schema.json"
      - "docs/GOVERNED_WORKFLOW_CONTINUITY_V2.md"
      - "docs/PROTOCOL_EXECUTION_PRECEDENCE_V2.md"
      - "docs/WORKSTREAM_TURN_TAKING_PROTOCOL_V2.md"
      - "scripts/validate_integration_registry.py"
      - "scripts/validate_workstream_compatibility.py"
      - "scripts/validate_workflow_continuity_integration.py"
      - "scripts/validate_governed_workflow_continuity_v2.py"
      - "tests/test_integration_registry.py"
      - "tests/test_workstream_compatibility.py"
      - "tests/test_identity_classification_integration_inventory.py"
      - "tests/test_workflow_continuity_integration.py"
      - "tests/test_governed_workflow_continuity_v2.py"
      - ".github/workflows/integration-assurance.yml"
  push:
    branches:
      - main
      - feature/integration-assurance-harness-v1
      - feature/integration-compatibility-matrix-v1
    paths:
      - "architecture/integration/**"
      - "architecture/identity/WORKFLOW_CONTINUITY_CURRENT.json"
      - "architecture/identity/VERA_GOVERNED_WORKFLOW_CONTINUITY_V2.json"
      - "schemas/vera_governed_workflow_continuity_v2.schema.json"
      - "docs/GOVERNED_WORKFLOW_CONTINUITY_V2.md"
      - "docs/PROTOCOL_EXECUTION_PRECEDENCE_V2.md"
      - "docs/WORKSTREAM_TURN_TAKING_PROTOCOL_V2.md"
      - "scripts/validate_integration_registry.py"
      - "scripts/validate_workstream_compatibility.py"
      - "scripts/validate_workflow_continuity_integration.py"
      - "scripts/validate_governed_workflow_continuity_v2.py"
      - "tests/test_integration_registry.py"
      - "tests/test_workstream_compatibility.py"
      - "tests/test_identity_classification_integration_inventory.py"
      - "tests/test_workflow_continuity_integration.py"
      - "tests/test_governed_workflow_continuity_v2.py"
      - ".github/workflows/integration-assurance.yml"

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned validator dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Validate historical integration registry
        run: python scripts/validate_integration_registry.py
      - name: Validate historical workstream compatibility matrix
        run: python -m scripts.validate_workstream_compatibility
      - name: Validate current governed workflow integration overlay
        run: python -m scripts.validate_workflow_continuity_integration
      - name: Validate current governed workflow contract V2
        run: python scripts/validate_governed_workflow_continuity_v2.py
      - name: Run integration registry history tests
        run: python -m unittest tests.test_integration_registry -v
      - name: Run workstream compatibility history tests
        run: python -m unittest tests.test_workstream_compatibility -v
      - name: Run Identity classification inventory tests
        run: >-
          python -m unittest
          tests.test_identity_classification_integration_inventory -v
      - name: Run current workflow-continuity integration tests
        run: >-
          python -m unittest
          tests.test_workflow_continuity_integration -v
      - name: Run current workflow-continuity V2 hostile tests
        run: >-
          python -m unittest
          tests.test_governed_workflow_continuity_v2 -v
      - name: Compile assurance validators and tests
        run: >-
          python -m py_compile
          scripts/validate_integration_registry.py
          scripts/validate_workstream_compatibility.py
          scripts/validate_workflow_continuity_integration.py
          scripts/validate_governed_workflow_continuity_v2.py
          tests/test_integration_registry.py
          tests/test_workstream_compatibility.py
          tests/test_identity_classification_integration_inventory.py
          tests/test_workflow_continuity_integration.py
          tests/test_governed_workflow_continuity_v2.py
