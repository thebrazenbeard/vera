name: Memory cross-chat contract

on:
  push:
    branches:
      - feature/memory-cross-chat-contract-v1
      - replacement/memory-cross-chat-durability-v1
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260730213000_harden_neutral_v3_memory_contract.sql"
      - "supabase/migrations/20260730213100_tighten_neutral_v3_memory_governance.sql"
      - "supabase/migrations/20260730213200_close_neutral_v3_memory_review_gaps.sql"
      - "supabase/migrations/20260730213300_add_neutral_v3_memory_request_durability.sql"
      - "supabase/tests/fixtures/neutral_v3_live_schema.sql"
      - "supabase/tests/fixtures/neutral_v3_cycle_preflight_fixture.sql"
      - "supabase/tests/fixtures/cleanup_neutral_v3_cycle_preflight_fixture.sql"
      - "supabase/tests/validate_neutral_v3_memory_contract.sql"
      - "supabase/tests/validate_neutral_v3_memory_governance.sql"
      - "supabase/tests/validate_neutral_v3_memory_temporal_fields.sql"
      - "supabase/tests/validate_neutral_v3_memory_review_corrections.sql"
      - "supabase/tests/exercise_neutral_v3_memory_concurrent_save.sql"
      - "supabase/tests/validate_neutral_v3_memory_request_durability.sql"
      - "supabase/tests/exercise_neutral_v3_memory_save.sql"
      - "supabase/tests/exercise_neutral_v3_memory_recall.sql"
      - "docs/MEMORY_CROSS_CHAT_CONTRACT_V1.md"
      - "docs/MEMORY_CROSS_CHAT_CONTRACT_V1_REVIEW_CORRECTION.md"
      - "reviews/MEMORY_CONTRACT_REVIEW.md"
      - ".github/workflows/memory-cross-chat-contract.yml"

permissions:
  contents: read

jobs:
  validate-memory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_CLI_VERSION: 2.101.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify pinned Supabase CLI
        run: test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"

      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Stage repository migrations for explicit replay
        run: |
          rm -rf supabase/migrations.explicit
          mv supabase/migrations supabase/migrations.explicit
          mkdir -p supabase/migrations

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Install cyclic lineage preflight fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/neutral_v3_cycle_preflight_fixture.sql

      - name: Prove correction migration rejects cyclic baseline
        shell: bash
        run: |
          set +e
          output=$(psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations.explicit/20260730213200_close_neutral_v3_memory_review_gaps.sql 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "multi-record supersession cycle" <<< "$output"

      - name: Remove cyclic lineage preflight fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/cleanup_neutral_v3_cycle_preflight_fixture.sql

      - name: Install observed neutral V3 live-schema fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/neutral_v3_live_schema.sql

      - name: Apply bounded Memory lineage migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213000_harden_neutral_v3_memory_contract.sql

      - name: Apply bounded Memory governance migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213100_tighten_neutral_v3_memory_governance.sql

      - name: Run adversarial lineage and access validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_contract.sql

      - name: Run adversarial provenance governance validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_governance.sql

      - name: Apply bounded Memory review correction migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213200_close_neutral_v3_memory_review_gaps.sql

      - name: Run adversarial independent-review correction validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_review_corrections.sql

      - name: Run adversarial temporal field validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_temporal_fields.sql

      - name: Apply append-only Memory request durability migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213300_add_neutral_v3_memory_request_durability.sql

      - name: Prove concurrent identical SAVE requests commit once
        shell: bash
        run: |
          set -euo pipefail
          test_file=supabase/tests/exercise_neutral_v3_memory_concurrent_save.sql
          psql "$PGDATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -f "$test_file" > /tmp/memory-request-a.json &
          pid_a=$!
          psql "$PGDATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -f "$test_file" > /tmp/memory-request-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          diff -u /tmp/memory-request-a.json /tmp/memory-request-b.json

      - name: Validate append-only request durability and interrupted recovery
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_request_durability.sql

      - name: Save governed memory in first invocation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/exercise_neutral_v3_memory_save.sql

      - name: Recall governed memory in independent invocation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/exercise_neutral_v3_memory_recall.sql

      - name: Run database lint
        run: supabase db lint --local

      - name: Stop and delete local stack
        if: always()
        run: supabase stop --no-backup
