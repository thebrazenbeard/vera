name: Memory cross-chat contract

on:
  push:
    branches:
      - feature/memory-cross-chat-contract-v1
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260730213000_harden_neutral_v3_memory_contract.sql"
      - "supabase/migrations/20260730213100_tighten_neutral_v3_memory_governance.sql"
      - "supabase/migrations/20260730213200_close_neutral_v3_memory_review_gaps.sql"
      - "supabase/migrations/20260731003000_add_memory_request_idempotency.sql"
      - "supabase/migrations/20260731003100_correct_memory_request_status_semantics.sql"
      - "supabase/tests/fixtures/neutral_v3_live_schema.sql"
      - "supabase/tests/fixtures/neutral_v3_cycle_preflight_fixture.sql"
      - "supabase/tests/fixtures/cleanup_neutral_v3_cycle_preflight_fixture.sql"
      - "supabase/tests/validate_neutral_v3_memory_contract.sql"
      - "supabase/tests/validate_neutral_v3_memory_governance.sql"
      - "supabase/tests/validate_neutral_v3_memory_temporal_fields.sql"
      - "supabase/tests/validate_neutral_v3_memory_review_corrections.sql"
      - "supabase/tests/validate_neutral_v3_memory_idempotency.sql"
      - "supabase/tests/validate_neutral_v3_memory_request_status_semantics.sql"
      - "supabase/tests/verify_neutral_v3_memory_receipt_recovery.sql"
      - "supabase/tests/exercise_neutral_v3_memory_save.sql"
      - "supabase/tests/exercise_neutral_v3_memory_recall.sql"
      - "docs/MEMORY_CROSS_CHAT_CONTRACT_V1.md"
      - "docs/MEMORY_CROSS_CHAT_CONTRACT_V1_REVIEW_CORRECTION.md"
      - "reviews/MEMORY_CONTRACT_REVIEW.md"
      - ".github/workflows/memory-cross-chat-contract.yml"

permissions:
  contents: read

jobs:
  validate-memory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_CLI_VERSION: 2.101.0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # immutable revision
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify pinned Supabase CLI
        run: test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"

      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Stage repository migrations for explicit replay
        run: |
          rm -rf supabase/migrations.explicit
          mv supabase/migrations supabase/migrations.explicit
          mkdir -p supabase/migrations

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Install cyclic lineage preflight fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/neutral_v3_cycle_preflight_fixture.sql

      - name: Prove correction migration rejects cyclic baseline
        shell: bash
        run: |
          set +e
          output=$(psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations.explicit/20260730213200_close_neutral_v3_memory_review_gaps.sql 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "multi-record supersession cycle" <<< "$output"

      - name: Remove cyclic lineage preflight fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/cleanup_neutral_v3_cycle_preflight_fixture.sql

      - name: Install observed neutral V3 live-schema fixture
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/fixtures/neutral_v3_live_schema.sql

      - name: Apply bounded Memory lineage migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213000_harden_neutral_v3_memory_contract.sql

      - name: Apply bounded Memory governance migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213100_tighten_neutral_v3_memory_governance.sql

      - name: Run adversarial lineage and access validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_contract.sql

      - name: Run adversarial provenance governance validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_governance.sql

      - name: Apply bounded Memory review correction migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260730213200_close_neutral_v3_memory_review_gaps.sql

      - name: Run adversarial independent-review correction validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_review_corrections.sql

      - name: Run adversarial temporal field validation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_temporal_fields.sql

      - name: Apply durable Memory request migration
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260731003000_add_memory_request_idempotency.sql

      - name: Apply Memory request status correction
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations.explicit/20260731003100_correct_memory_request_status_semantics.sql

      - name: Validate request idempotency and interrupted state
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_idempotency.sql

      - name: Validate request status semantics
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/validate_neutral_v3_memory_request_status_semantics.sql

      - name: Recover receipt and result in separate invocation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/verify_neutral_v3_memory_receipt_recovery.sql

      - name: Prove concurrent identical requests commit once
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' SQL <<'SQL' || true
          select public.append_vera_context_v3(
            'MREQ-idempotency-concurrent',
            jsonb_build_object(
              'project_id', 'vera-memory-idempotency-test',
              'branch_id', 'branch-a',
              'record_key', 'memory.idempotency.concurrent',
              'record_type', 'FACT',
              'statement', 'Concurrent duplicate request fixture.',
              'lifecycle_status', 'CURRENT',
              'epistemic_status', 'DOCUMENTED_SOURCE',
              'source_actor', 'EXTERNAL',
              'privacy_scope', 'PROJECT',
              'event_time', '2026-07-31T00:32:00+00:00',
              'state_time', '2026-07-31T00:32:00+00:00',
              'source_evidence', jsonb_build_array(
                jsonb_build_object(
                  'surface', 'GITHUB_ACTIONS_LOCAL_SUPABASE',
                  'observation', 'Concurrent duplicate arrival fixture.'
                )
              ),
              'semantic_tags', jsonb_build_object(
                'topics', jsonb_build_array('memory', 'concurrency'),
                'status', jsonb_build_array('current')
              ),
              'limitations', jsonb_build_array(
                'Synthetic CI record in a disposable database.'
              )
            )
          )::text;
          SQL
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/memory-request-a.json &
          pid_a=$!
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/memory-request-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          diff -u /tmp/memory-request-a.json /tmp/memory-request-b.json
          test "$(psql "$PGDATABASE_URL" -Atc "select count(*) from public.vera_context_events_v3 where project_id='vera-memory-idempotency-test' and branch_id='branch-a' and record_key='memory.idempotency.concurrent'")" = "1"
          test "$(psql "$PGDATABASE_URL" -Atc "select count(*) from public.vera_memory_requests_v3 where request_id='MREQ-idempotency-concurrent' and request_state='COMPLETE'")" = "1"

      - name: Prove concurrent changed-payload reuse serializes to one success and one conflict
        shell: bash
        run: |
          set -euo pipefail
          make_sql() {
            local key="$1"
            local statement="$2"
            cat <<SQL
          select public.append_vera_context_v3(
            'MREQ-idempotency-concurrent-conflict',
            jsonb_build_object(
              'project_id', 'vera-memory-idempotency-test',
              'branch_id', 'branch-a',
              'record_key', '$key',
              'record_type', 'FACT',
              'statement', '$statement',
              'lifecycle_status', 'CURRENT',
              'epistemic_status', 'DOCUMENTED_SOURCE',
              'source_actor', 'EXTERNAL',
              'privacy_scope', 'PROJECT',
              'event_time', '2026-07-31T00:33:00+00:00',
              'state_time', '2026-07-31T00:33:00+00:00',
              'source_evidence', jsonb_build_array(
                jsonb_build_object(
                  'surface', 'GITHUB_ACTIONS_LOCAL_SUPABASE',
                  'observation', 'Concurrent changed-payload fixture.'
                )
              ),
              'semantic_tags', jsonb_build_object(
                'topics', jsonb_build_array('memory', 'concurrency', 'conflict'),
                'status', jsonb_build_array('current')
              ),
              'limitations', jsonb_build_array(
                'Synthetic CI record in a disposable database.'
              )
            )
          )::text;
          SQL
          }
          sql_a="$(make_sql memory.idempotency.concurrent-conflict-a 'Concurrent payload A.')"
          sql_b="$(make_sql memory.idempotency.concurrent-conflict-b 'Concurrent payload B.')"
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$sql_a" > /tmp/memory-conflict-a.json &
          pid_a=$!
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$sql_b" > /tmp/memory-conflict-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          classes="$(printf '%s\n%s\n' \
            "$(jq -r '.result_class' /tmp/memory-conflict-a.json)" \
            "$(jq -r '.result_class' /tmp/memory-conflict-b.json)" | sort | tr '\n' ' ')"
          test "$classes" = "COMPLETE CONFLICT "
          test "$(psql "$PGDATABASE_URL" -Atc "select count(*) from public.vera_context_events_v3 where project_id='vera-memory-idempotency-test' and branch_id='branch-a' and record_key in ('memory.idempotency.concurrent-conflict-a','memory.idempotency.concurrent-conflict-b')")" = "1"
          test "$(psql "$PGDATABASE_URL" -Atc "select count(*) from public.vera_memory_requests_v3 where request_id='MREQ-idempotency-concurrent-conflict' and request_state='COMPLETE'")" = "1"

      - name: Save governed memory in first invocation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/exercise_neutral_v3_memory_save.sql

      - name: Recall governed memory in independent invocation
        run: >-
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/tests/exercise_neutral_v3_memory_recall.sql

      - name: Run database lint
        run: supabase db lint --local

      - name: Stop and delete local stack
        if: always()
        run: supabase stop --no-backup
