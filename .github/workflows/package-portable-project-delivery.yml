name: Package portable project delivery

on:
  push:
    branches:
      - feature/portable-project-bootstrap-v1

permissions:
  contents: write

jobs:
  package:
    if: contains(github.event.head_commit.message, '[delivery-build]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact delivery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build ChatGPT-native package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="architecture/releases/R7A0_20260731_EC7D18F7"
          root="/tmp/VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1"
          mkdir -p "$root/PROJECT_FILES" "$root/PROJECT_INSTRUCTIONS"

          cp "$release_dir"/* "$root/PROJECT_FILES/"
          cp architecture/bootstrap/VERA_BOOTSTRAP_MANIFEST_V1.json "$root/PROJECT_FILES/"
          cp architecture/bootstrap/VERA_NATIVE_PROJECT_INSTRUCTIONS_BOOTLOADER_V1.txt "$root/PROJECT_INSTRUCTIONS/"
          cp docs/PORTABLE_PROJECT_BOOTSTRAP_V1.md "$root/INSTALLATION_GUIDE.md"

          project_file_count="$(find "$root/PROJECT_FILES" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$project_file_count" -eq 22
          test "$project_file_count" -le 25

          cat > "$root/START_HERE.txt" <<'EOF'
          V.E.R.A. PORTABLE PROJECT UPLOAD BUNDLE

          CHATGPT PROJECT FILE COUNT: 22

          1. Create a fresh ChatGPT Project.
          2. Upload all 22 files inside PROJECT_FILES. Do not upload the folder itself.
          3. Replace the Project Instructions field with the complete contents of:
             PROJECT_INSTRUCTIONS/VERA_NATIVE_PROJECT_INSTRUCTIONS_BOOTLOADER_V1.txt
          4. Connect GitHub and Supabase.
          5. Open the first chat and send exactly:
             VERA::INITIALIZE::PORTABLE_PROJECT_V1

          Do not upload INSTALLATION_GUIDE.md, START_HERE.txt, DELIVERY_CHECKSUMS.sha256,
          or anything in PROJECT_INSTRUCTIONS as a Project file.
          EOF

          (
            cd "$root"
            find PROJECT_FILES PROJECT_INSTRUCTIONS -type f -print0 | sort -z | xargs -0 sha256sum > DELIVERY_CHECKSUMS.sha256
          )

          cd /tmp
          zip -qr VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1.zip "$(basename "$root")"
          sha256sum VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1.zip > VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1.zip.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1
          path: |
            /tmp/VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1.zip
            /tmp/VERA_PORTABLE_PROJECT_UPLOAD_BUNDLE_R7A1_20260731_V1.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish delivery run locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .delivery
          printf '%s\n' "$GITHUB_RUN_ID" > .delivery/last_bundle_run_id.txt
          printf '%s\n' "$GITHUB_SHA" > .delivery/last_bundle_source_sha.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/last_bundle_run_id.txt .delivery/last_bundle_source_sha.txt
          git commit -m "[delivery-result] Record portable bundle artifact run"
          git push origin HEAD:feature/portable-project-bootstrap-v1
