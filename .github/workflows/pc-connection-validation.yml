name: PC Connection Bridge validation

on:
  pull_request:
    paths:
      - "pc_connection/**"
      - "docs/PC_CONNECTION_BRIDGE_V1.md"
      - "schemas/vera_pc_connection_*.schema.json"
      - "supabase/migrations/*pc_connection*.sql"
      - "supabase/tests/*pc_connection*.sql"
      - "tests/pc_connection/**"
      - ".github/workflows/pc-connection-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-unit:
    name: contract unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Compile package and tests
        run: python -m compileall -q pc_connection tests/pc_connection
      - name: Run PCCC unit and hostile tests
        run: python -m unittest discover -s tests/pc_connection -p "test_*.py" -v

  boundary-evidence:
    name: authorization boundary evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify forbidden capability declarations
        run: |
          python - <<'PY'
          from pc_connection import FORBIDDEN_CAPABILITIES, PHASE_ONE_OPERATIONS

          forbidden_operations = {
              "RUN_COMMAND",
              "RUN_APPROVED_COMMAND",
              "START_PROCESS",
              "MODEL_EXECUTION",
              "TRAINING",
          }
          overlap = PHASE_ONE_OPERATIONS & forbidden_operations
          if overlap:
              raise SystemExit(f"forbidden phase-one operations: {sorted(overlap)}")

          required_boundaries = {
              "ARBITRARY_SHELL",
              "INBOUND_LISTENER",
              "ADMIN_INSTALL",
              "AUTOMATIC_UPDATE",
              "MODEL_EXECUTION",
              "TRAINING",
              "PRODUCTION_MIGRATION",
              "CREDENTIAL_CREATION",
              "CANONICAL_MEMORY_WRITE",
          }
          if FORBIDDEN_CAPABILITIES != required_boundaries:
              raise SystemExit("authorization boundary declaration drift")
          PY
