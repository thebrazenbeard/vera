name: Portable project bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "architecture/bootstrap/**"
      - "schemas/vera_portable_*"
      - "scripts/validate_portable_project_bootstrap.py"
      - "tests/test_portable_project_bootstrap.py"
      - "docs/PORTABLE_PROJECT_BOOTSTRAP_V1.md"
      - "supabase/migrations/20260731142200_create_vera_portable_bootstrap_registry_v1.sql"
      - "supabase/tests/validate_portable_bootstrap_registry_v1.sql"
      - ".github/workflows/portable-project-bootstrap.yml"
  push:
    branches:
      - feature/portable-project-bootstrap-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGDATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_CLI_VERSION: 2.101.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable bootstrap
        run: python scripts/validate_portable_project_bootstrap.py
      - name: Run hostile unit tests
        run: python -m unittest tests.test_portable_project_bootstrap
      - name: Compile validator
        run: python -m py_compile scripts/validate_portable_project_bootstrap.py tests/test_portable_project_bootstrap.py
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Verify pinned Supabase CLI
        run: test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"
      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Install pgTAP
        run: psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap"
      - name: Apply bootstrap registry migration in disposable stack
        run: psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260731142200_create_vera_portable_bootstrap_registry_v1.sql
      - name: Validate bootstrap registry
        run: psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/validate_portable_bootstrap_registry_v1.sql
      - name: Run database lint
        run: supabase db lint --local
      - name: Stop and delete local stack
        if: always()
        run: supabase stop --no-backup
