name: Portable project bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/portable-project-bootstrap.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-r7a1-retry-receipt-repair:
    if: github.event.pull_request.head.ref == 'feature/r7a1-behavior-laws-successor-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20

      - name: Recover SHA-bound retry-receipt repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/${{ github.repository }}/issues/43/comments?per_page=100' > /tmp/comments.json
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          matches = []
          pattern = re.compile(r'<!-- VERA_R7A1_RETRY_RECEIPT_REPAIR_V6 part=1/1 -->\s*([A-Za-z0-9+/=\s]+)\Z')
          for item in comments:
              if item.get('user', {}).get('login') != 'thebrazenbeard':
                  continue
              match = pattern.search(item.get('body') or '')
              if match:
                  matches.append(''.join(match.group(1).split()))
          if len(matches) != 1:
              raise SystemExit(f'expected one repair payload, found {len(matches)}')
          compressed = base64.b64decode(matches[0], validate=True)
          compressed_expected = 'b6e1a5cb89fd54e10c0a3eb725be7c872eb0a0dac4ffe87cef4808843b1c4544'
          if hashlib.sha256(compressed).hexdigest() != compressed_expected:
              raise SystemExit('compressed repair SHA-256 mismatch')
          script = gzip.decompress(compressed)
          script_expected = 'fd95b98a55dcc22e2e2c8cd2c0631a4f6987d8cb3c3f971d5d9ccc6408e9812a'
          if hashlib.sha256(script).hexdigest() != script_expected:
              raise SystemExit('repair script SHA-256 mismatch')
          Path('/tmp/repair_r7a1_retry_v6.py').write_bytes(script)
          PY

      - name: Restore canonical workflow, repair, validate, and commit
        run: |
          set -euo pipefail
          git checkout beff9534fa21ed573d294f4d00a91ee571868f60 -- .github/workflows/portable-project-bootstrap.yml
          python /tmp/repair_r7a1_retry_v6.py
          python scripts/validate_r7a1_behavior_successor.py
          python -m unittest tests.test_r7a1_behavior_successor
          git config user.name 'V.E.R.A. Project Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No repair changes found'; exit 1; }
          git commit -m 'Enforce normalized retry receipt contract'
          git push origin HEAD:feature/r7a1-behavior-laws-successor-v1
