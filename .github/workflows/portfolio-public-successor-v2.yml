name: Vera Portfolio Public-Safe Successor V2

on:
  push:
    branches:
      - work/vera-portfolio-public-successor-20260927
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-portfolio-public-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run public-safe successor tests
        run: |
          python -m unittest -v             tests.test_portfolio_public_successor_v2             tests.test_portfolio_runtime_absorbed_v2

      - name: Compile absorbed runtime and builder
        run: |
          python -m compileall -q portfolio_runtime
          python -m py_compile scripts/build_portfolio_public_successor_v2.py

      - name: Rebuild freshness twice and require stable second result
        shell: bash
        run: |
          set -euo pipefail
          before_cut_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('architecture/portfolio/VERA_PORTFOLIO_PUBLIC_CUT_V2.json').read_text())
          print(p['cut_sha256'])
          PY
          )"

          python scripts/build_portfolio_public_successor_v2.py
          git diff --binary > /tmp/refresh-first.patch

          after_first_cut_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('architecture/portfolio/VERA_PORTFOLIO_PUBLIC_CUT_V2.json').read_text())
          print(p['cut_sha256'])
          PY
          )"
          test "$before_cut_sha" = "$after_first_cut_sha"

          python scripts/build_portfolio_public_successor_v2.py
          git diff --binary > /tmp/refresh-second.patch
          cmp /tmp/refresh-first.patch /tmp/refresh-second.patch

          after_second_cut_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('architecture/portfolio/VERA_PORTFOLIO_PUBLIC_CUT_V2.json').read_text())
          print(p['cut_sha256'])
          PY
          )"
          test "$before_cut_sha" = "$after_second_cut_sha"

      - name: Re-run successor tests after live freshness refresh
        run: |
          python -m unittest -v             tests.test_portfolio_public_successor_v2             tests.test_portfolio_runtime_absorbed_v2

      - name: Verify no whitespace damage
        run: git diff --check
