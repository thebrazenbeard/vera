name: Predecessor import validation

on:
  pull_request:
    paths:
      - "providers/vera_control_plane/migrations/20260912193000_create_predecessor_import_staging.sql"
      - "scripts/predecessor_import_batch.py"
      - "tests/test_predecessor_import_batch.py"
      - "tests/test_predecessor_import_staging.py"
      - ".github/workflows/predecessor-import-validation.yml"
  push:
    branches:
      - "work/predecessor-import-readback-hardening-20260913"
    paths:
      - "providers/vera_control_plane/migrations/20260912193000_create_predecessor_import_staging.sql"
      - "scripts/predecessor_import_batch.py"
      - "tests/test_predecessor_import_batch.py"
      - "tests/test_predecessor_import_staging.py"
      - ".github/workflows/predecessor-import-validation.yml"

permissions:
  contents: read

jobs:
  predecessor-import:
    name: predecessor import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5"
      - name: Compile importer and tests
        run: python -m compileall -q scripts/predecessor_import_batch.py tests/test_predecessor_import_batch.py tests/test_predecessor_import_staging.py
      - name: Run predecessor importer tests
        run: python -m pytest -q tests/test_predecessor_import_batch.py tests/test_predecessor_import_staging.py
