name: R6A0 release package

on:
  push:
    branches:
      - integration/project-orchestration-r6a0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-r6a0-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Validate checksums, manifests, YAML, and boundaries
        run: python scripts/validate_r6a0_release.py

      - name: Compile validator
        run: python -m py_compile scripts/validate_r6a0_release.py
