name: R6A1 release bindings

on:
  pull_request:
    paths:
      - "architecture/releases/R6A1_20260731_B20E7309/**"
      - "docs/MAIN_MERGE_AUTHORITY_AUDIT_20260731.md"
      - "scripts/validate_r6a1_release_bindings.py"
      - "tests/test_r6a1_release_bindings.py"
      - ".github/workflows/r6a1-release-bindings.yml"
  push:
    branches:
      - feature/replacement-release-r6a1-v1

permissions:
  contents: read

jobs:
  validate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify declared source commit is available
        run: git cat-file -e b20e7309c6ded3c358dce00baa537d2fc1880004^{commit}
      - name: Validate exact source bindings
        run: python scripts/validate_r6a1_release_bindings.py
      - name: Run hostile binding tests
        run: python -m unittest tests.test_r6a1_release_bindings -v
      - name: Compile validator and tests
        run: python -m py_compile scripts/validate_r6a1_release_bindings.py tests/test_r6a1_release_bindings.py
