name: R7A0 release package

on:
  pull_request:
    branches:
      - main
    paths:
      - "architecture/releases/R7A0_20260731_EC7D18F7/**"
      - "scripts/validate_r7a0_release.py"
      - ".github/workflows/r7a0-release-package.yml"
  push:
    branches:
      - release/r7a0-20260731-ec7d18f7
    paths:
      - "architecture/releases/R7A0_20260731_EC7D18F7/**"
      - "scripts/validate_r7a0_release.py"
      - ".github/workflows/r7a0-release-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned YAML dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate R7A0 package
        run: python scripts/validate_r7a0_release.py
      - name: Compile release validator
        run: python -m py_compile scripts/validate_r7a0_release.py
