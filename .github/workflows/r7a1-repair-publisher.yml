name: R7A1 bounded repair publisher

on:
  push:
    branches:
      - feature/r7a1-behavior-laws-successor-v1

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover exact repair payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/${{ github.repository }}/issues/43/comments?per_page=100' > /tmp/comments.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          import tarfile
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          parts = {}
          pattern = re.compile(r'<!-- VERA_R7A1_REPAIR_PAYLOAD part=(\d)/5 -->\s*([A-Za-z0-9+/=\s]+)\Z')
          for item in comments:
              if item.get('user', {}).get('login') != 'thebrazenbeard':
                  continue
              match = pattern.search(item.get('body') or '')
              if match:
                  parts[int(match.group(1))] = ''.join(match.group(2).split())
          if sorted(parts) != [1, 2, 3, 4, 5]:
              raise SystemExit(f'incomplete repair payload parts: {sorted(parts)}')
          encoded = ''.join(parts[index] for index in range(1, 6))
          payload = base64.b64decode(encoded, validate=True)
          expected = '46c2c904d2a543fbf7c077b39390a979a3766523044ebb9bbad00df7b65283ec'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload SHA-256 mismatch: {actual}')
          archive = Path('/tmp/r7a1-repair.tgz')
          archive.write_bytes(payload)
          allowed = {
              'architecture/releases/R7A1_20260801_BHV053/VERA_R7A1_LAWS.md',
              'architecture/releases/R7A1_20260801_BHV053/VERA_R7A1_PROJECT_INSTRUCTIONS.md',
              'architecture/releases/R7A1_20260801_BHV053/VERA_R7A1_VALIDATION.yaml',
              'architecture/releases/R7A1_20260801_BHV053/VERA_R7A1_VALIDATION_REPORT.md',
              'architecture/releases/R7A1_20260801_BHV053/VERA_R7A1_CHECKSUMS.sha256',
              'architecture/bootstrap/VERA_BOOTSTRAP_MANIFEST_V1.json',
              'architecture/bootstrap/VERA_PORTABLE_SCAFFOLD_MANIFEST_V1.json',
              'scripts/validate_r7a1_behavior_successor.py',
              'tests/test_r7a1_behavior_successor.py',
          }
          with tarfile.open(archive, 'r:gz') as tf:
              names = {member.name for member in tf.getmembers() if member.isfile()}
              if names != allowed:
                  raise SystemExit(f'payload path mismatch: {sorted(names)}')
              tf.extractall('.', filter='data')
          PY

      - name: Validate and publish corrected exact head
        run: |
          set -euo pipefail
          rm .github/workflows/r7a1-repair-publisher.yml
          python scripts/validate_r7a1_behavior_successor.py
          python -m unittest tests.test_r7a1_behavior_successor
          git config user.name 'V.E.R.A. Project Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No repair changes found'; exit 1; }
          git commit -m 'Apply Behaviors exact-head semantic repairs'
          git push origin HEAD:feature/r7a1-behavior-laws-successor-v1
