name: R8A0 bounded vertical slice

on:
  pull_request:
    paths:
      - "r8a0/**"
      - "tests/r8a0/**"
      - "docs/r8a0/**"
      - ".github/workflows/r8a0-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q r8a0 tests/r8a0
      - name: Run positive and hostile tests
        run: python -m unittest discover -s tests/r8a0 -p 'test_*.py' -v
      - name: Reject prohibited path drift
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="HEAD^"; fi
          git diff --name-only "$BASE_SHA" HEAD | \
            grep -Ev '^(r8a0/|tests/r8a0/|docs/r8a0/|\.github/workflows/r8a0-[^/]+\.yml$)' > /tmp/prohibited || true
          test ! -s /tmp/prohibited
