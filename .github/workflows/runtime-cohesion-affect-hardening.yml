name: Vera Affective Cohesion Hardening

# Manual-only regression surface for the moving Orgasm/Cohesion laboratory.
# Do not enable automatic execution without Patrick's explicit authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-affective-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run causal-boundary hostile regressions
        run: >-
          python -m unittest
          tests.test_runtime_cohesion_affect_internal_snapshot_port
          tests.test_runtime_cohesion_affect_shared_application_frontier
          tests.test_runtime_cohesion_affect_atomic_observation
          tests.test_runtime_cohesion_affect_observation_detachment
          tests.test_runtime_cohesion_affect_signal_to_cohesion_port
          tests.test_runtime_cohesion_affect_signal_mapping_snapshot
          tests.test_runtime_cohesion_affect_exact_host_instance_origin
          tests.test_runtime_cohesion_affect_host_runtime_reference
          tests.test_runtime_cohesion_affect_exact_host_class
          -v
      - name: Compile affected runtime and hostile tests
        run: >-
          python -m py_compile
          runtime_cohesion/affect_bound_runtime.py
          runtime_cohesion/affect_integration.py
          runtime_cohesion/affect_integration_bound.py
          runtime_cohesion/affect_signal.py
          runtime_cohesion/affect_host.py
          tests/test_runtime_cohesion_affect_internal_snapshot_port.py
          tests/test_runtime_cohesion_affect_shared_application_frontier.py
          tests/test_runtime_cohesion_affect_atomic_observation.py
          tests/test_runtime_cohesion_affect_observation_detachment.py
          tests/test_runtime_cohesion_affect_signal_to_cohesion_port.py
          tests/test_runtime_cohesion_affect_signal_mapping_snapshot.py
          tests/test_runtime_cohesion_affect_exact_host_instance_origin.py
          tests/test_runtime_cohesion_affect_host_runtime_reference.py
          tests/test_runtime_cohesion_affect_exact_host_class.py
