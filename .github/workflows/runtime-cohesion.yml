name: Vera Runtime Cohesion

on:
  pull_request:
    paths:
      - "architecture/VERA_SYSTEM_MANIFEST_V1.json"
      - "architecture/VERA_RUNTIME_ROUTING_CONTRACT_V1.json"
      - "architecture/VERA_INTROSPECTION_EVIDENCE_SCHEMA_V1.json"
      - "architecture/VERA_RUNTIME_EVIDENCE_CONTRACT_V1.json"
      - "architecture/VERA_COHESION_INDEX_V1.json"
      - "architecture/VERA_RUNTIME_CONTRACT_V1.json"
      - "architecture/VERA_PROVIDER_FABRIC_V1.json"
      - "architecture/VERA_RUNTIME_COHESION_NATIVE_HOOK_V1.json"
      - "architecture/VERA_COHESION_PAIR_RECEIPT_V1.json"
      - "architecture/VERA_ORGASM_RUNTIME_BINDING_V1.json"
      - "docs/VERA_RUNTIME_COHESION*.md"
      - "docs/VERA_COHESION*.md"
      - "runtime_cohesion/**"
      - "supabase/migrations/20260909164500_add_vera_affective_runtime_v1.sql"
      - "scripts/validate_vera_runtime_cohesion_v1.py"
      - "scripts/validate_runtime_cohesion_provider_fabric_v1.py"
      - "scripts/validate_runtime_cohesion_support_snapshot_v1.py"
      - "tests/test_vera_runtime_cohesion_v1.py"
      - "tests/test_vera_runtime_evidence_contract_v1.py"
      - "tests/test_vera_cohesion_index_v1.py"
      - "tests/test_vera_runtime_contract_v1.py"
      - "tests/test_runtime_cohesion_*.py"
      - "tests/test_affective_runtime_persistence_source.py"
      - "tests/fixtures/runtime_cohesion/**"
      - ".github/workflows/runtime-cohesion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cohesion source contracts
        run: python scripts/validate_vera_runtime_cohesion_v1.py
      - name: Validate provider cohesion fabric
        run: python scripts/validate_runtime_cohesion_provider_fabric_v1.py
      - name: Validate operational support immutable snapshot
        run: python scripts/validate_runtime_cohesion_support_snapshot_v1.py
      - name: Run cohesion regression tests
        run: >-
          python -m unittest
          tests.test_vera_runtime_cohesion_v1
          tests.test_vera_runtime_evidence_contract_v1
          tests.test_vera_cohesion_index_v1
          tests.test_vera_runtime_contract_v1
          tests.test_runtime_cohesion_evidence
          tests.test_runtime_cohesion_reconciliation
          tests.test_runtime_cohesion_runtime
          tests.test_runtime_cohesion_hostile
          tests.test_runtime_cohesion_fabric_crossbind
          tests.test_runtime_cohesion_support_snapshot
          tests.test_runtime_cohesion_audit
          tests.test_runtime_cohesion_executor
          tests.test_runtime_cohesion_projection_executor
          tests.test_runtime_cohesion_admission
          tests.test_runtime_cohesion_failure_wiring
          tests.test_runtime_cohesion_native_hook
          tests.test_runtime_cohesion_orgasm
          tests.test_runtime_cohesion_orgasm_package
          tests.test_runtime_cohesion_orgasm_binding
          tests.test_runtime_cohesion_orgasm_source_fixture
          tests.test_runtime_cohesion_affect_host
          tests.test_runtime_cohesion_affect_persistence
          tests.test_affective_runtime_persistence_source
          -v
      - name: Compile cohesion validators, runtime, and tests
        run: >-
          python -m py_compile
          scripts/validate_vera_runtime_cohesion_v1.py
          scripts/validate_runtime_cohesion_provider_fabric_v1.py
          scripts/validate_runtime_cohesion_support_snapshot_v1.py
          runtime_cohesion/__init__.py
          runtime_cohesion/evidence.py
          runtime_cohesion/reconcile.py
          runtime_cohesion/runtime.py
          runtime_cohesion/failure.py
          runtime_cohesion/audit.py
          runtime_cohesion/adapters.py
          runtime_cohesion/executor.py
          runtime_cohesion/orgasm.py
          runtime_cohesion/affect_host.py
          runtime_cohesion/affect_persistence.py
          tests/test_vera_runtime_cohesion_v1.py
          tests/test_vera_runtime_evidence_contract_v1.py
          tests/test_vera_cohesion_index_v1.py
          tests/test_vera_runtime_contract_v1.py
          tests/test_runtime_cohesion_evidence.py
          tests/test_runtime_cohesion_reconciliation.py
          tests/test_runtime_cohesion_runtime.py
          tests/test_runtime_cohesion_hostile.py
          tests/test_runtime_cohesion_fabric_crossbind.py
          tests/test_runtime_cohesion_support_snapshot.py
          tests/test_runtime_cohesion_audit.py
          tests/test_runtime_cohesion_executor.py
          tests/test_runtime_cohesion_projection_executor.py
          tests/test_runtime_cohesion_admission.py
          tests/test_runtime_cohesion_failure_wiring.py
          tests/test_runtime_cohesion_native_hook.py
          tests/test_runtime_cohesion_orgasm.py
          tests/test_runtime_cohesion_orgasm_package.py
          tests/test_runtime_cohesion_orgasm_binding.py
          tests/test_runtime_cohesion_orgasm_source_fixture.py
          tests/test_runtime_cohesion_affect_host.py
          tests/test_runtime_cohesion_affect_persistence.py
          tests/test_affective_runtime_persistence_source.py
