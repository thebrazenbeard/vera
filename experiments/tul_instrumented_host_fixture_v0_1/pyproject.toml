[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tul-instrumented-host-fixture"
version = "0.1.0"
description = "Host-neutral Temporal Utterance Layer instrumented fixture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
